<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Take a 50-question personality quiz to discover which Black Sheep Town character you resemble.">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://jehlp.net/black-sheep-town/quiz/">
    <title>Black Sheep Town Character Quiz · jehlp.net</title>
    <link rel="icon" href="https://jehlp.net/site-theme/v2/favicons/black-sheep-town.png" type="image/png">
    <script src="https://jehlp.net/site-theme/v2/theme.js"></script>
    <link rel="stylesheet" href="https://jehlp.net/site-theme/v2/base.css">
    <link rel="stylesheet" href="quiz.css?v=20260812.3">
  </head>
  <body data-site-tone="blue">
    <a class="skip-link" href="#quiz">Skip to quiz</a>

    <header class="site-header site-header--identity quiz-header">
      <div class="site-brand"><img class="site-mark" src="https://jehlp.net/site-theme/v2/marks/black-sheep-town.png" width="32" height="32" alt=""><a class="site-title" href="../">Black Sheep Town</a></div>
      <nav aria-label="Site links">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use dark theme" aria-pressed="false">◐</button>
      </nav>
    </header>

    <main id="quiz" class="quiz-shell">
      <section class="quiz-card quiz-intro" id="intro-panel">
        <p class="kicker">50 questions · 16 characters</p>
        <h1>Which <cite>Black Sheep Town</cite> character are you?</h1>
        <button class="primary-button" id="start-quiz" type="button">Start quiz</button>
      </section>

      <section class="quiz-card question-panel" id="question-panel" hidden aria-labelledby="question-text">
        <div class="progress-row">
          <span id="question-count">Question 1 of 50</span>
          <span id="progress-percent">2%</span>
        </div>
        <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
        <p class="question-category" id="question-category"></p>
        <h1 id="question-text"></h1>
        <fieldset class="answer-list" id="answer-list">
          <legend class="visually-hidden">Choose one answer</legend>
        </fieldset>
        <div class="question-actions">
          <button class="secondary-button" id="previous-question" type="button">← Back</button>
          <button class="primary-button" id="next-question" type="button" disabled>Next →</button>
        </div>
      </section>

      <section class="quiz-card result-panel" id="result-panel" hidden aria-live="polite">
        <p class="kicker">Result</p>
        <div class="result-grid">
          <figure class="result-portrait-frame">
            <img id="result-portrait" alt="">
          </figure>
          <div class="result-copy">
            <h1 id="result-name"></h1>
            <p class="result-tagline" id="result-tagline"></p>
            <p id="result-description"></p>
            <div class="result-notes">
              <div><strong>Your strength</strong><span id="result-strength"></span></div>
              <div><strong>Your blind spot</strong><span id="result-watch"></span></div>
            </div>
          </div>
        </div>
        <section class="trait-section" aria-labelledby="trait-heading">
          <h2 id="trait-heading">What tipped the scales</h2>
          <div class="trait-bars" id="trait-bars"></div>
        </section>
        <p class="runner-up" id="runner-up"></p>
        <div class="result-actions">
          <button class="primary-button" id="copy-result" type="button">Copy result</button>
          <button class="secondary-button" id="restart-quiz" type="button">Take it again</button>
        </div>
      </section>
    </main>

    <footer class="quiz-footer">
      <p>Unofficial, noncommercial fan project. Character portraits © BA-KU.</p>
    </footer>

    <script src="quiz.js?v=20260812.4"></script>
  </body>
</html>
